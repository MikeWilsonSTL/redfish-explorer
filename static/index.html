<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redfish Explorer</title>
  <link rel="stylesheet" href="/static/app.css">
  <script>
    // Dark is the default. Apply a saved light choice before first paint.
    try { if (localStorage.getItem("theme") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}
  </script>
</head>
<body>
  <header class="top">
    <button id="tree-toggle" class="tree-toggle" aria-controls="tree" aria-expanded="false"
            aria-label="Resource tree">☰</button>
    <span class="brand">Redfish Explorer</span>
    <label class="source"><span>Source</span>
      <select id="source"></select>
    </label>
    <form id="goto" class="goto">
      <input id="goto-path" spellcheck="false" placeholder="/redfish/v1/...">
      <button>Go</button>
    </form>
    <button id="theme-toggle" class="theme-toggle" type="button"></button>
  </header>
  <div class="shell">
    <nav id="tree" class="tree" aria-label="Resource tree"></nav>
    <div id="scrim" class="scrim"></div>
    <main id="main" class="main"></main>
  </div>
  <footer class="foot">
    <a href="https://github.com/MikeWilsonSTL/redfish-explorer">Source</a> (AGPL-3.0)
    · Mockups and schemas from DMTF
    <a href="https://github.com/DMTF/Redfish-Publications">Redfish-Publications</a>,
    © DMTF, <a href="/licenses/DMTF-Redfish-Publications.txt">BSD-3-Clause</a>
    · Redfish is a trademark of DMTF. Not affiliated with or endorsed by DMTF.
  </footer>
  <script src="/static/schema.js"></script>
  <script src="/static/app.js"></script>
  <script>
    // Light/dark toggle. The button shows the mode it switches to.
    (() => {
      const root = document.documentElement, btn = document.getElementById("theme-toggle");
      const label = () => {
        const light = root.dataset.theme === "light";
        btn.textContent = light ? "☾" : "☀";
        btn.title = btn.ariaLabel = light ? "Switch to dark mode" : "Switch to light mode";
      };
      btn.addEventListener("click", () => {
        if (root.dataset.theme === "light") delete root.dataset.theme; else root.dataset.theme = "light";
        try { localStorage.setItem("theme", root.dataset.theme === "light" ? "light" : "dark"); } catch (e) {}
        label();
      });
      label();
    })();
  </script>
</body>
</html>
